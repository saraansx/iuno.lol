name: Deploy to EC2

on:
  push:
    branches: [main]

# Two pushes back to back must not build over each other on the same box.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: root
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 20m
          script: |
            set -e
            cd /root/iuno.lol

            git fetch origin main
            git reset --hard origin/main
            npm install --legacy-peer-deps

            # Build into a side folder so the live .next keeps serving traffic.
            # Seed it with the old cache: that is where the 30-day ISR cache
            # lives, and it keeps the build incremental.
            rm -rf .next-build .next-old
            # Stale generated route types (e.g. deleted pages) break the build
            # typecheck — drop them, they regenerate. ISR cache stays.
            rm -rf .next/types
            mkdir -p .next-build
            cp -r .next/cache .next-build/cache 2>/dev/null || true

            NEXT_DIST_DIR=.next-build npm run build

            # Build passed -> swap it in. If it had failed, set -e stopped us
            # above and .next is still the old working build.
            if [ -d .next ]; then mv .next .next-old; fi
            mv .next-build .next
            pm2 reload iuno-web --update-env || pm2 restart iuno-web
            rm -rf .next-old

            sleep 5
            curl -fsS -o /dev/null http://127.0.0.1:3000/api/health
            echo "deploy ok"

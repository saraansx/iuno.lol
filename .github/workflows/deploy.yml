name: Deploy to EC2

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@master
        with:
          host: 44.203.30.158
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ubuntu/iuno.lol
            git fetch origin main
            git reset --hard origin/main
            npm install --legacy-peer-deps
            npm run build
            pm2 restart iuno-web

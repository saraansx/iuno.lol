name: Deploy to EC2

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ubuntu/iuno.lol
            git fetch origin main
            git reset --hard origin/main
            npm install --legacy-peer-deps
            mkdir -p /home/ubuntu/next-cache-backup
            cp -rn .next/cache/* /home/ubuntu/next-cache-backup/ 2>/dev/null || true

            # 1. Build to temporary folder while .next is still serving traffic
            npm run build -- --dest .next-temp || npm run build

            # 2. If separate folder was built, instant atomic swap; otherwise ensure cache restored
            if [ -d ".next-temp" ]; then
              cp -rn /home/ubuntu/next-cache-backup/* .next-temp/cache/ 2>/dev/null || true
              rm -rf .next-old
              mv .next .next-old 2>/dev/null || true
              mv .next-temp .next
              rm -rf .next-old
            else
              cp -rn /home/ubuntu/next-cache-backup/* .next/cache/ 2>/dev/null || true
            fi

            rm -rf /home/ubuntu/next-cache-backup
            pm2 reload iuno-web || pm2 restart iuno-web
